<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f5c55">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="robots" content="noindex,nofollow">
<title>Orion Tower Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: app shell. Left rail on PC, bottom tab bar on phone. Tower diagram on Home. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#eaefed; --line:#d5dedb;
  --fg:#16211f; --muted:#5b6a66; --accent:#0f5c55; --accent-fg:#ffffff; --brass:#a8742a;
  --ok:#1f7a4d; --ok-bg:#dcefe4; --vac:#6b7774; --vac-bg:#e6eae9; --warn:#9a6200; --warn-bg:#f8ead0;
  --info:#285e9e; --info-bg:#dde8f5; --own:#6a4a9c; --own-bg:#ebe3f6; --bad:#c0392b; --bad-bg:#f8dedb;
  --display:"Sora",ui-sans-serif,system-ui,sans-serif; --body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#171f1e; --surface-2:#1f2a28; --line:#2c3a37;
  --fg:#e5ecea; --muted:#9aa9a5; --accent:#4fb3a6; --accent-fg:#06201d; --brass:#d6a557;
  --ok:#6fd19c; --ok-bg:#183a29; --vac:#a3b0ad; --vac-bg:#26302e; --warn:#f0b75a; --warn-bg:#3a2d14;
  --info:#8bb8ec; --info-bg:#1b2c40; --own:#bfa2ea; --own-bg:#2c2340; --bad:#f08a7e; --bad-bg:#40201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#171f1e; --surface-2:#1f2a28; --line:#2c3a37;
  --fg:#e5ecea; --muted:#9aa9a5; --accent:#4fb3a6; --accent-fg:#06201d; --brass:#d6a557;
  --ok:#6fd19c; --ok-bg:#183a29; --vac:#a3b0ad; --vac-bg:#26302e; --warn:#f0b75a; --warn-bg:#3a2d14;
  --info:#8bb8ec; --info-bg:#1b2c40; --own:#bfa2ea; --own-bg:#2c2340; --bad:#f08a7e; --bad-bg:#40201c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:1.45rem;font-weight:600}
h2{font-size:1.1rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* shell */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.brand b{font-family:var(--display);font-size:1rem;display:block;line-height:1.1}
.brand span{font-size:.75rem;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav-btn svg{width:20px;height:20px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--surface-2);color:var(--accent);font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.mobile-brand{display:none}
.search{flex:1;position:relative;max-width:560px}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgb(0 0 0 / .15);max-height:60vh;overflow:auto;z-index:20}
.results button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:10px 14px;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}
.results button:hover,.results button:focus{background:var(--surface-2)}
.content{padding-block:18px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1180px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.link{border:0;background:none;padding:4px 6px;color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

/* cards & lists */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{font-family:var(--display);font-size:1.6rem;display:block;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis}
.avatar{width:38px;height:38px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:.85rem;flex:none;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.st-Rented{background:var(--ok-bg);color:var(--ok)}
.st-Vacant{background:var(--vac-bg);color:var(--vac)}
.st-Reserved{background:var(--warn-bg);color:var(--warn)}
.st-Sold{background:var(--info-bg);color:var(--info)}
.st-Owner-occupied{background:var(--own-bg);color:var(--own)}
.pill.norent{background:var(--surface-2);color:var(--brass)}
.pill.closed{background:var(--vac-bg);color:var(--vac)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.88rem}
.note.info{background:var(--info-bg);color:var(--info)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th,.tbl td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.phaserow{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 36px;gap:6px;align-items:center}
.phaserow input{padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0;width:100%}
.alert{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:8px;width:100%;text-align:left;cursor:pointer;font-weight:500}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:currentColor}
.alerts{display:flex;flex-direction:column;gap:6px}
.tbl tr.total td{border-top:2px solid var(--line);background:var(--surface-2)}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.splitrow{display:grid;grid-template-columns:1fr 140px 36px;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px}
.splitrow select,.splitrow input[name="sv"]{padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0;width:100%}
.splitrow label.given{display:flex;flex-direction:row;align-items:center;gap:8px;font-weight:400;flex-wrap:wrap}
.splitrow label.given input{width:auto}
.nav-btn{position:relative}
.nav-btn .short{display:none}
.more-links{display:none}
@media (max-width:900px){.nav-btn.pc-only{display:none}.more-links{display:grid}}
@media (max-width:900px){.nav-btn .long{display:none}.nav-btn .short{display:inline}}
.nav-btn .badge{position:absolute;top:4px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
@media (min-width:901px){.nav-btn .badge{position:static;margin-left:auto}}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 16px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.acct{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.acct+.acct{margin-top:8px}
.two>.acct+.acct{margin-top:0}
.acct code{font-size:.85rem;overflow-wrap:anywhere}

/* tower */
.tower{display:flex;flex-direction:column;gap:6px}
.floor{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:stretch}
.floor-name{font-family:var(--display);font-weight:600;font-size:.85rem;display:flex;flex-direction:column;justify-content:center}
.floor-name small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.68rem}
.cells{display:flex;gap:4px;min-width:0}
.cell{border:0;border-radius:6px;padding:7px 6px;min-width:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px;min-height:56px}
.cell b{font-size:.78rem}
.cell span{font-size:.7rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell:hover{outline:2px solid var(--accent)}
.cell.double{min-height:76px}
.core{flex:0 0 26px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--line) 6px 7px)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* modal */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgb(0 0 0 / .3)}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.85rem;font-weight:600}
.field .hint{font-size:.78rem;color:var(--muted)}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
.field textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;background:var(--bg);font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.sharerow select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.sharerow input{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
.sharerow{display:grid;grid-template-columns:1fr 110px 36px;gap:8px;align-items:center}
.x{border:1px solid var(--line);background:none;border-radius:8px;height:38px;cursor:pointer;color:var(--muted)}
.err{color:var(--bad);font-size:.85rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:60;font-weight:500;font-size:.9rem}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));border-right:0;border-top:1px solid var(--line);z-index:30;gap:0}
  .rail .brand{display:none}
  .nav-btn{flex-direction:column;gap:2px;font-size:.64rem;padding:6px 1px;flex:1;align-items:center;text-align:center;min-width:0}
  .nav-btn span{overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .mobile-brand{display:grid}
  .two,.grid2{grid-template-columns:1fr}
  .phaserow{grid-template-columns:1fr 1fr}
  .splitrow{grid-template-columns:1fr 36px}
  .splitrow input[name="sv"]{grid-column:1/2}
  .phaserow [name="pl"]{grid-column:1/-1}
  .modal{align-self:flex-end;max-height:92%}
  .scrim{padding:0;align-items:flex-end}
  .modal{border-radius:14px 14px 0 0;width:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (max-width:520px){
  .stat b{font-size:1.2rem;white-space:nowrap}
  .stats{grid-template-columns:1fr 1fr}
  .floor{grid-template-columns:44px 1fr}
  .cell span{display:none}
  .cell{min-height:44px;padding:6px 4px}
  .cell.double{min-height:58px}
  .core{flex-basis:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Main">
    <div class="brand"><div class="brand-mark">O</div><div><b>Orion Tower</b><span>Manager · Bahawalpur</span></div></div>
  </nav>
  <div class="main">
    <div class="topbar">
      <div class="brand-mark mobile-brand" aria-hidden="true">O</div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search units, owners, outlets, tenants, accounts" autocomplete="off" aria-label="Search">
        <div class="results" id="results" hidden></div>
      </div>
    </div>
    <main class="content" id="view"></main>
  </div>
</div>
<div id="modal-root"></div>

<script>
(()=>{
"use strict";
/* ---------- constants ---------- */
const SIZES=[1153,607,661,620,607,607];
const FLOORS=[
  {key:"R",name:"Rooftop",short:"Roof",prefix:"R",note:"Shops 1–3, lift & stairs, 4–6"},
  {key:"2ndF",name:"Second floor",short:"2ndF",prefix:"2ndF"},
  {key:"F1",name:"First floor",short:"F1",prefix:"F"},
  {key:"G",name:"Ground floor",short:"G",prefix:"G",note:"Double story, counted once"},
  {key:"LG",name:"Lower ground",short:"LG",prefix:"LG",note:"Basement"}
];
const STATUSES=["Vacant","Rented","Sold","Owner-occupied","Reserved"];
const HOLDERS={owner:"Shop owner",orion:"Orion Tower",other:"Other account"};
const ICONS={
  home:'<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  units:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M8 15h2M14 15h2"/>',
  people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.5 3.5 5.2"/>',
  accounts:'<path d="M3 9 12 4l9 5"/><path d="M5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 20h18"/>',
  agreements:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h5"/>',
  money:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>',
  ops:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
  reports:'<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
  more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>'
};
const TABS=[["home","Home"],["units","Units"],["people","People"],["agreements","Agreements"],["money","Money"],["ops","Ops"],["reports","Reports"],["more","More"]];
const PC_ONLY=["people","reports"];

/* ---------- storage (IndexedDB, falls back to memory) ---------- */
const Store={
  db:null,
  open(){return new Promise(res=>{
    try{const r=indexedDB.open("orion-tower-manager",1);
      r.onupgradeneeded=()=>r.result.createObjectStore("kv");
      r.onsuccess=()=>{this.db=r.result;res()};
      r.onerror=()=>res();
    }catch(e){res()}
  })},
  get(k){return new Promise(res=>{
    if(!this.db)return res(undefined);
    try{const q=this.db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}catch(e){res(undefined)}
  })},
  set(k,v){return new Promise(res=>{
    if(!this.db)return res(false);
    try{const t=this.db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}
  })}
};
let D=null; // all data
let saved=true;
const uid=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const now=()=>new Date().toISOString();

function seed(){
  const units=[];
  FLOORS.forEach(f=>{for(let i=1;i<=6;i++){
    units.push({id:f.prefix+i,floor:f.key,no:i,size:f.key==="R"?null:SIZES[i-1],saleRate:null,rentRate:null,serviceCharges:null,status:"Vacant",noRent:false,notes:"",updatedAt:now()});
  }});
  const U=id=>units.find(u=>u.id===id);
  const outlets=[];
  const addOutlet=(name,ids,extra={})=>{outlets.push({id:uid("out"),name,unitIds:ids,active:true,business:"",phone:"",notes:"",noRent:false,updatedAt:now(),...extra});ids.forEach(i=>U(i).status="Rented")};
  addOutlet("Equator",["G1"]);addOutlet("Koco",["G2"]);addOutlet("wedrink",["G3"]);
  addOutlet("Haier",["G4","G5"]);addOutlet("Brio",["G6"]);

function renderNav(){
  const rail=$("#rail");
  rail.querySelectorAll(".nav-btn").forEach(b=>b.remove());
  TABS.forEach(([k,l])=>{
    const b=document.createElement("button");b.className="nav-btn";b.innerHTML=icon(k)+(k==="agreements"?`<span class="long">${l}</span><span class="short">Leases</span>`:`<span>${l}</span>`);
    if(route.tab===k)b.setAttribute("aria-current","page");
    if(PC_ONLY.includes(k))b.classList.add("pc-only");
    if(k==="ops"&&(overdueTasks().length||liftStatus().some(x=>x.missing)))b.insertAdjacentHTML("beforeend",'<span class="badge" aria-label="needs attention"></span>');
    if(k==="money"&&lateItems().length)b.insertAdjacentHTML("beforeend",'<span class="badge" aria-label="late payments"></span>');

/* ---------- agreements (step 2) ---------- */
const pad2=n=>String(n).padStart(2,"0");
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`};
function addMonths(iso,m){if(!iso)return "";const [y,mo,d]=iso.split("-").map(Number);const t=new Date(y,mo-1+m,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return `${t.getFullYear()}-${pad2(t.getMonth()+1)}-${pad2(Math.min(d,last))}`}
const ymOf=iso=>iso?iso.slice(0,7):"";
const ymAdd=(ym,m)=>addMonths(ym+"-01",m).slice(0,7);
const daysBetween=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);
const fmtDate=iso=>{if(!iso)return "—";const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d||1).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})};
const fmtYM=ym=>{if(!ym)return "—";const [y,m]=ym.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"short",year:"numeric"})};
const agsOfOutlet=oid=>D.agreements.filter(a=>a.outletId===oid).sort((a,b)=>(b.active-a.active)||String(b.agreementDate).localeCompare(a.agreementDate));
const activeAgsOfUnit=uid_=>D.agreements.filter(a=>a.active&&(a.unitIds||[]).includes(uid_));
const RENEW_WARN_DAYS=30;
/* rent due for a month (YYYY-MM). 0 during the grace period. Phases win over the normal rent. */
function rentFor(a,ym){
  if(!a||!ym)return 0;
  if(a.rentStart&&ym<ymOf(a.rentStart))return 0;
  const ph=(a.phases||[]).find(p=>p.from&&p.to&&p.from<=ym&&ym<=p.to);
  if(ph)return Number(ph.rent)||0;
  const h=(a.rentHistory||[]).filter(x=>ymOf(x.from)<=ym).sort((x,y)=>x.from.localeCompare(y.from));
  return Number((h.length?h[h.length-1]:(a.rentHistory||[])[0]||{rent:0}).rent)||0;
}
function scFor(a,ym){if(!a||a.scMode!=="separate")return 0;if(a.rentStart&&ym<ymOf(a.rentStart))return 0;return Number(a.scAmount)||0}
const currentRent=a=>{const h=(a.rentHistory||[]);return h.length?Number(h[h.length-1].rent)||0:0};
function renewalState(a){
  if(!a.active||!a.nextRenewal)return {k:"none"};
  const d=daysBetween(todayISO(),a.nextRenewal);
  if(d<0)return {k:"overdue",d,txt:`Renewal ${-d} day${d===-1?"":"s"} overdue`};
  if(d<=RENEW_WARN_DAYS)return {k:"soon",d,txt:d===0?"Renewal due today":`Renewal in ${d} day${d===1?"":"s"}`};
  return {k:"ok",d,txt:`Renews ${fmtDate(a.nextRenewal)}`};
}
function phaseChange(a){
  if(!a.active)return null;const ym=ymOf(todayISO());const nx=ymAdd(ym,1);
  const r0=rentFor(a,ym),r1=rentFor(a,nx);
  if(r0!==r1&&(a.phases||[]).length)return {from:r0,to:r1,ym:nx};
  return null;
}
function nextRenewalFrom(agDate,since){
  if(!agDate)return "";let n=1,d=addMonths(agDate,11);
  while(since&&d<=since&&n<40){n++;d=addMonths(agDate,11*n)}
  return d;
}
const agTitle=a=>`${outlet(a.outletId)?.name||"Outlet"} · ${(a.unitIds||[]).slice().sort(unitSort).join(" + ")}`;
const rsPill=st=>st.k==="overdue"?`<span class="pill dot bad">${esc(st.txt)}</span>`:st.k==="soon"?`<span class="pill st-Reserved">${esc(st.txt)}</span>`:st.k==="ok"?`<span class="pill st-Vacant">${esc(st.txt)}</span>`:"";
function agRow(a){
  const st=renewalState(a);const ym=ymOf(todayISO());
  const ow=(a.ownerIds||[]).map(i=>owner(i)?.name).filter(Boolean);
  return `<button class="item" data-go-ag="${a.id}"><div class="avatar">${esc(initials(outlet(a.outletId)?.name))}</div><div class="grow"><div class="t">${esc(agTitle(a))}</div>
   <div class="s num">${pkr(rentFor(a,ym))} rent${a.scMode==="separate"?" + "+pkr(a.scAmount)+" service":a.scMode==="included"?" incl. service":""} this month${ow.length?" · with "+esc(ow.join(", ")):""}</div></div>
   ${a.active?rsPill(st):'<span class="pill closed">Ended</span>'}</button>`;
}
let agFilter="active";
function viewAgreements(){
  const list=D.agreements.filter(a=>agFilter==="all"||(agFilter==="active"?a.active:!a.active))

const DUE_DAY=10;
const curYM=()=>ymOf(todayISO());
const dueDate=ym=>ym+"-"+pad2(DUE_DAY);
const isLate=ym=>todayISO()>dueDate(ym);
const trackFrom=()=>D.meta.trackFrom||curYM();
function agMonths(a){
  if(!a.active&&!a.endedYM)return [];
  let from=trackFrom();if(a.rentStart&&ymOf(a.rentStart)>from)from=ymOf(a.rentStart);
  const to=curYM();const out=[];let m=from;let n=0;while(m<=to&&n<240){out.push(m);m=ymAdd(m,1);n++}
  return out;
}
const paysFor=(agId,ym)=>D.payments.filter(p=>p.agreementId===agId&&p.month===ym);
function dueRow(a,ym){
  const ps=paysFor(a.id,ym);const sum=f=>ps.reduce((s,p)=>s+(Number(p[f])||0),0);
  const rentDue=rentFor(a,ym),scDue=scFor(a,ym);
  const rentPaid=sum("rentAmount")+sum("taxAmount"),rentDisc=sum("rentDiscount");
  const scPaid=sum("scAmount"),scDisc=sum("scDiscount");
  const rentBal=Math.max(0,rentDue-rentPaid-rentDisc),scBal=Math.max(0,scDue-scPaid-scDisc);
  const late=isLate(ym);
  const st=(due,bal,paid)=>due===0?"none":bal<=0?"paid":late?"late":paid>0?"part":"due";
  return {a,ym,ps,rentDue,scDue,rentPaid,rentDisc,scPaid,scDisc,rentBal,scBal,late,
    rentSt:st(rentDue,rentBal,rentPaid+rentDisc),scSt:st(scDue,scBal,scPaid+scDisc),
    over:(rentPaid+rentDisc-rentDue)+(scDue?scPaid+scDisc-scDue:0)};
}
function lateItems(){
  const out=[];
  D.agreements.filter(a=>a.active&&!outlet(a.outletId)?.noRent).forEach(a=>agMonths(a).forEach(ym=>{const r=dueRow(a,ym);
    if(r.rentSt==="late")out.push({kind:"Rent",r,bal:r.rentBal,days:daysBetween(dueDate(ym),todayISO())});
    if(r.scSt==="late")out.push({kind:"Service charges",r,bal:r.scBal,days:daysBetween(dueDate(ym),todayISO())});
  }));
  return out.sort((x,y)=>y.days-x.days);
}
const ST_LABEL={paid:"Paid",late:"Late",part:"Part paid",due:"Due by 10th",none:"—"};
const stPill=s=>s==="paid"?'<span class="pill st-Rented">Paid</span>':s==="late"?'<span class="pill dot bad">Late</span>':s==="part"?'<span class="pill st-Reserved">Part paid</span>':s==="due"?'<span class="pill st-Vacant">Due by 10th</span>':"";
function reminderText(a,ym){
  const r=dueRow(a,ym);const o=outlet(a.outletId);const parts=[];
  if(r.rentBal>0)parts.push(`rent ${pkr(r.rentBal)}`);if(r.scBal>0)parts.push(`service charges ${pkr(r.scBal)}`);
  return `Assalam-o-Alaikum. This is a reminder from Orion Tower management, Bahawalpur, for ${o?.name||"your outlet"} (unit ${a.unitIds.slice().sort(unitSort).join(", ")}). The ${parts.join(" and ")} for ${fmtYM(ym)} was due by ${DUE_DAY} ${fmtYM(ym)}. Kindly arrange the payment at your earliest and share the slip. JazakAllah.\n\nKashif Mahmood\nGeneral Manager, Orion Tower`;
}

  ${rows.map(r=>`<tr><td><button class="btn link" data-go-ag="${r.a.id}" style="padding:0">${esc(agTitle(r.a))}</button></td><td>${pkr(r.rentDue)}</td><td>${pkr(r.rentPaid)}${r.rentDisc?`<div class="small muted">+ ${pkr(r.rentDisc)} discount</div>`:""}</td><td>${stPill(r.rentSt)}</td>
    <td>${r.scDue?pkr(r.scDue):'<span class="muted">'+(r.a.scMode==="included"?"In rent":"—")+"</span>"}</td><td>${r.scDue?pkr(r.scPaid):""}${r.scDisc?`<div class="small muted">+ ${pkr(r.scDisc)} discount</div>`:""}</td><td>${stPill(r.scSt)}</td>
    <td><div class="row" style="flex-wrap:nowrap">${r.rentBal+r.scBal>0?`<button class="btn sm" data-act="remind" data-ag="${r.a.id}" data-ym="${ym}">Reminder</button>`:""}<button class="btn sm primary" data-act="add-pay" data-ag="${r.a.id}" data-ym="${ym}">+ Payment</button></div></td></tr>`).join("")||`<tr><td colspan="8" class="muted">No active agreements with rent for this month. Add agreements first.</td></tr>`}
  </tbody></table></div>`;
}

/* photo: compress to max 1400px JPEG and keep in its own storage slot */
function compressImage(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const max=1400;let {width:w,height:h}=img;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.72))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

  {onSave:async()=>{

    const rentAmount=n("rentAmount"),taxAmount=n("taxAmount"),scAmount=sep?n("scAmount"):0,rentDiscount=n("rentDiscount"),scDiscount=sep?n("scDiscount"):0;
    if(rentAmount+taxAmount+scAmount+rentDiscount+scDiscount===0)return "Type the amount received.";
    if(rentDiscount>0&&!fv("rentDiscountReason"))return "A rent discount needs a reason.";
    if(scDiscount>0&&!fv("scDiscountReason"))return "A service charges discount needs a reason.";

    $("#cautions").innerHTML=c.map(t=>`<div class="note">${t}</div>`).join("");

    try{photoData=await compressImage(f);photoChanged=true;$("#photo-prev").src=photoData;$("#photo-prev").hidden=false;$("#photo-st").textContent="Photo ready"}catch(err){$("#photo-st").textContent="Could not read that photo. Try another."}});

/* tiny offline .xlsx writer: one sheet, inline strings, uncompressed zip */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
function zipStore(files){const enc=new TextEncoder();const parts=[],cent=[];let off=0;
  for(const [name,txt] of files){const nb=enc.encode(name),db=enc.encode(txt),crc=crc32(db);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,crc,true);h.setUint32(18,db.length,true);h.setUint32(22,db.length,true);h.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(h.buffer),nb,db);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,crc,true);c.setUint32(20,db.length,true);c.setUint32(24,db.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
    cent.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+db.length}
  const cs=cent.reduce((s,x)=>s+x.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cent,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}
function makeXlsx(sheetName,aoa,widths){
  const x=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
  const col=i=>{let s="";i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
  const rows=aoa.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>{const ref=col(ci)+(ri+1);if(v===""||v==null)return "";
    const st=ri===2?' s="1"':(ri===0?' s="2"':"");
    return typeof v==="number"&&isFinite(v)?`<c r="${ref}"${st||' s="3"'}><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${x(v)}</t></is></c>`}).join("")}</row>`).join("");
  const cols=widths?`<cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("")}</cols>`:"";
  return zipStore([
   ["[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
   ["_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
   ["xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${x(sheetName.replace(/[\\\/?*\[\]:]/g," ").slice(0,31))}" sheetId="1" r:id="rId1"/></sheets></workbook>`],
   ["xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
   ["xl/styles.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDCEBE8"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
   ["xl/worksheets/sheet1.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${rows}</sheetData></worksheet>`]
  ]);

 {id:"tax",name:"Tax deducted",desc:"Tax amounts recorded per payment",filters:["range","outlet"],build:f=>{
   const rows=D.payments.filter(p=>p.taxAmount&&p.month>=f.from&&p.month<=f.to&&(f.outlet==="all"||p.outletId===f.outlet)).map(p=>[fmtYM(p.month),fmtDate(p.date),outlet(p.outletId)?.name,p.rentAmount,p.taxAmount,(+p.rentAmount||0)+(+p.taxAmount||0)]);

];
let repState={id:null,f:null,hidden:[]};
function defaultFilters(){const t=curYM();return {from:ymAdd(t,-2)<trackFrom()?trackFrom():ymAdd(t,-2),to:t,floor:"all",outlet:"all",account:"all",days:"30"}}
function viewReports(){
  if(repState.id)return viewReport();

  return `<div class="page-head"><div><div class="label">Filter, then export to Excel, Google Sheets or Word</div><h1>Reports</h1></div></div>
  ${saved.length?`<section class="panel"><h2 style="margin-bottom:10px">My saved reports</h2><div class="chips">${saved.map((s,i)=>`<span class="row" style="gap:2px"><button class="chip" data-open-saved="${i}">${esc(s.name)}</button><button class="btn link sm" data-del-saved="${i}" aria-label="Remove ${esc(s.name)}">✕</button></span>`).join("")}</div></section>`:""}
  <div class="list">${REPORTS.map(r=>`<button class="item" data-open-rep="${r.id}"><div class="grow"><div class="t">${esc(r.name)}</div><div class="s">${esc(r.desc)}</div></div><span class="muted">›</span></button>`).join("")}</div>
`;
}
function runReport(){const def=REPORTS.find(r=>r.id===repState.id);const out=def.build(repState.f);const keep=out.cols.map((_,i)=>!repState.hidden.includes(i));return {def,out,keep}}
function viewReport(){
  const {def,out,keep}=runReport();const f=repState.f;
  const fmt=(v,i)=>(out.money||[]).includes(i)&&v!==""&&v!=null?pkr(v):esc(v??"");
  const sums=out.sum?out.cols.map((_,i)=>out.sum.includes(i)?out.rows.reduce((s,r)=>s+(Number(r[i])||0),0):null):null;

  return `<div><button class="btn link" data-rep-back>← Reports</button></div>

   <div class="row"><button class="btn primary" data-export="xlsx">Excel</button><button class="btn" data-export="sheets">Google Sheets</button><button class="btn" data-export="doc">Word / Doc</button><button class="btn" data-export="csv">CSV</button></div></div>
  ${fl.length?`<section class="panel"><div class="row" style="align-items:flex-end">
    ${fl.includes("range")?`<div class="field" style="width:auto"><label for="rf-from">From</label><input id="rf-from" type="month" value="${f.from}" data-rf="from"></div><div class="field" style="width:auto"><label for="rf-to">To</label><input id="rf-to" type="month" value="${f.to}" data-rf="to"></div>`:""}
    ${fl.includes("floor")?`<div class="field" style="width:auto"><label for="rf-floor">Floor</label><select id="rf-floor" data-rf="floor"><option value="all">All floors</option>${FLOORS.map(x=>`<option value="${x.key}" ${f.floor===x.key?"selected":""}>${x.name}</option>`).join("")}</select></div>`:""}
    ${fl.includes("outlet")?`<div class="field" style="width:auto"><label for="rf-outlet">Outlet</label><select id="rf-outlet" data-rf="outlet"><option value="all">All outlets</option>${D.outlets.map(o=>`<option value="${o.id}" ${f.outlet===o.id?"selected":""}>${esc(o.name)}</option>`).join("")}</select></div>`:""}
    ${fl.includes("account")?`<div class="field" style="width:auto"><label for="rf-account">Account</label><select id="rf-account" data-rf="account"><option value="all">All accounts</option>${D.accounts.map(a=>`<option value="${a.id}" ${f.account===a.id?"selected":""}>${esc(acctHolderName(a))} · ${esc(a.bank)}</option>`).join("")}</select></div>`:""}
    ${fl.includes("days")?`<div class="field" style="width:auto"><label for="rf-days">Within</label><select id="rf-days" data-rf="days">${["30","60","90"].map(d=>`<option ${f.days===d?"selected":""} value="${d}">${d} days</option>`).join("")}</select></div>`:""}
  </div></section>`:""}
  <details class="panel"><summary style="cursor:pointer;font-weight:600">Choose columns and save as my report</summary>
    <div class="chips" style="margin-top:10px">${out.cols.map((c,i)=>`<button class="chip" data-col="${i}" aria-pressed="${keep[i]}">${esc(c)}</button>`).join("")}</div>
    <div class="row" style="margin-top:10px"><input id="save-name" placeholder="Name, e.g. Ground floor rent" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);flex:1;min-width:0"><button class="btn" data-save-rep>Save</button></div></details>
  <div class="panel" style="overflow-x:auto"><table class="tbl num"><thead><tr>${out.cols.map((c,i)=>keep[i]?`<th>${esc(c)}</th>`:"").join("")}</tr></thead><tbody>
   ${out.rows.map(r=>`<tr>${r.map((v,i)=>keep[i]?`<td>${fmt(v,i)}</td>`:"").join("")}</tr>`).join("")||`<tr><td colspan="${out.cols.length}" class="muted">Nothing to show for these filters.</td></tr>`}
   ${sums&&out.rows.length?`<tr class="total">${sums.map((v,i)=>keep[i]?`<td>${i===0?"<b>Total</b>":v==null?"":"<b>"+fmt(v,i)+"</b>"}</td>`:"").join("")}</tr>`:""}
  </tbody></table></div>`;

function reportMatrix(){const {def,out,keep}=runReport();const cols=out.cols.filter((_,i)=>keep[i]);const rows=out.rows.map(r=>r.filter((_,i)=>keep[i]));
  if(out.sum&&out.rows.length){const t=out.cols.map((_,i)=>i===0?"Total":out.sum.includes(i)?out.rows.reduce((s,r)=>s+(Number(r[i])||0),0):"");rows.push(t.filter((_,i)=>keep[i]))}
  return {def,cols,rows}}
function fileName(ext){return `Orion-${repState.id}-${todayISO()}.${ext}`}
function saveBlob(blob,name){try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);toast("Saved "+name)}catch(e){toast("Download is blocked here. Use Google Sheets (copy) instead.")}}
async function exportReport(kind){
  const {def,cols,rows}=reportMatrix();
  const title=`${def.name} · Orion Tower, Bahawalpur`;
  if(kind==="sheets"){const tsv=[cols,...rows].map(r=>r.map(v=>String(v??"").replace(/\t|\n/g," ")).join("\t")).join("\n");
    try{await navigator.clipboard.writeText(tsv);openModal("Copied for Google Sheets",`<p style="margin:0">The table is copied. Open <b>sheets.new</b> in your browser, click cell A1 and paste. Automatic sync to your own Google Sheet comes after you approve the Google connection.</p>`)}
    catch(e){openModal("Copy for Google Sheets",`<p class="small muted" style="margin:0">Select all, copy, then paste into cell A1 of a Google Sheet.</p><textarea style="min-height:220px;width:100%">${esc(tsv)}</textarea>`)}return}
  if(kind==="csv"){const csv=[cols,...rows].map(r=>r.map(v=>{const s=String(v??"");return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}).join(",")).join("\r\n");saveBlob(new Blob(["﻿"+csv],{type:"text/csv"}),fileName("csv"));return}
  if(kind==="doc"){const html=`<html><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Calibri,Arial,sans-serif}table{border-collapse:collapse}td,th{border:1px solid #999;padding:4px 8px;font-size:10pt}th{background:#e6efed}</style></head><body><h2>${esc(def.name)}</h2><p>Orion Tower, Bahawalpur · prepared ${fmtDate(todayISO())}</p><table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(typeof v==="number"?v.toLocaleString("en-PK"):v)}</td>`).join("")}</tr>`).join("")}</table></body></html>`;
    saveBlob(new Blob(["﻿"+html],{type:"application/msword"}),fileName("doc"));return}
  saveBlob(makeXlsx(def.name,[[title],[],cols,...rows],cols.map(c=>Math.max(12,c.length+3))),fileName("xlsx"));
}

/* ---------- search ---------- */
function search(q){
  q=q.toLowerCase();const out=[];const has=(...v)=>v.some(x=>String(x||"").toLowerCase().includes(q));
  D.units.forEach(u=>{const o=activeOutletOf(u.id);if(has(u.id,o?.name,u.notes))out.push({k:"Unit",t:u.id+(o?" · "+o.name:""),r:{tab:"units",id:u.id}})});
  D.owners.forEach(o=>{if(has(o.name,o.phone,o.cnic))out.push({k:"Owner",t:o.name,r:{tab:"people",owner:o.id}})});
  D.outlets.forEach(o=>{if(has(o.name,o.business))out.push({k:"Outlet",t:o.name,r:{tab:"people",outlet:o.id}})});
  D.tenants.forEach(t=>{if(has(t.name,t.phone,t.cnic))out.push({k:"Tenant",t:t.name,r:{tab:"people",tenant:t.id}})});
  D.accounts.forEach(a=>{if(has(a.bank,a.title,a.number,a.label))out.push({k:"Account",t:`${a.bank} · ${a.number} (${acctHolderName(a)})`,r:a.holder==="owner"&&a.ownerId?{tab:"people",owner:a.ownerId}:{tab:"people",ptab:"accounts"}})});
  D.payments.forEach(p=>{const a=D.agreements.find(x=>x.id===p.agreementId);if(has(p.note,p.rentDiscountReason,p.scDiscountReason)||(q.replace(/,/g,"").match(/^\d{3,}$/)&&[p.rentAmount,p.scAmount].some(v=>String(v)===q.replace(/,/g,""))))out.push({k:"Payment",t:`${a?agTitle(a):"Payment"} · ${fmtYM(p.month)} · ${pkr((+p.rentAmount||0)+(+p.scAmount||0))}`,pay:p.id})});
  return out.slice(0,30);
}

  if(d.goUnit){closeModal();go({tab:"units",id:d.goUnit});return}
  if(d.goOwner){go({tab:"people",owner:d.goOwner});return}
  if(d.goOutlet){go({tab:"people",outlet:d.goOutlet});return}
  if(d.goTenant){go({tab:"people",tenant:d.goTenant});return}
  if(d.back){if(d.ptabBack)peopleTab=d.ptabBack;go({tab:d.back});return}
  if(d.ufFloor){unitFilter.floor=d.ufFloor;render();return}
  if(d.ptab){peopleTab=d.ptab;render();return}
  if(d.agf){agFilter=d.agf;render();return}
  if(d.mtab){moneyTab=d.mtab;render();return}
  if(d.gotoTab){go({tab:d.gotoTab});return}
  if(d.otab){opsTab=d.otab;render();return}
  if(d.otabGo){opsTab=d.otabGo;go({tab:"ops"});return}
  if(d.toggleSalary!==undefined){showSalary=!showSalary;render();return}
  if(d.openRep){repState={id:d.openRep,f:defaultFilters(),hidden:[]};render();window.scrollTo(0,0);return}
  if(d.repBack!==undefined){repState={id:null};render();return}
  if(d.col!=null){const i=+d.col;repState.hidden=repState.hidden.includes(i)?repState.hidden.filter(x=>x!==i):[...repState.hidden,i];render();return}
  if(d.export){exportReport(d.export);return}
  if(d.saveRep!==undefined){const n=$("#save-name").value.trim();if(!n){toast("Type a name first");return}D.meta.savedReports=D.meta.savedReports||[];D.meta.savedReports.push({name:n,id:repState.id,f:{...repState.f},hidden:repState.hidden.slice()});await persist();toast("Saved as "+n);return}
  if(d.openSaved!=null){const sv=D.meta.savedReports[+d.openSaved];const f=defaultFilters();repState={id:sv.id,f:{...f,...sv.f},hidden:sv.hidden.slice()};render();return}
  if(d.delSaved!=null){D.meta.savedReports.splice(+d.delSaved,1);await persist();render();return}
  if(d.mtabGo){moneyTab=d.mtabGo;go({tab:"money"});return}
  if(d.mym){moneyYM=d.mym;render();return}
  if(d.addSplit!==undefined){if(!D.accounts.length)return;const sp=$("#splits");if(!sp.querySelector(".splitrow"))sp.innerHTML="";sp.insertAdjacentHTML("beforeend",splitRowHTML());return}
  if(d.rmSplit!==undefined){b.closest(".splitrow").remove();return}
  if(d.goAg){closeModal();go({tab:"agreements",ag:d.goAg});return}
  if(d.addPhase!==undefined){$("#phases").insertAdjacentHTML("beforeend",phaseRowHTML());return}
  if(d.rmPhase!==undefined){b.closest(".phaserow").remove();return}
  switch(d.act){
    case "edit-unit":formUnit(d.id);break;
    case "add-owner":formOwner(null,d.unit);break;
    case "edit-owner":formOwner(d.id);break;
    case "add-outlet":formOutlet(null,d.unit);break;
    case "edit-outlet":formOutlet(d.id);break;
    case "add-tenant":formTenant(null,d.outlet);break;
    case "edit-tenant":formTenant(d.id);break;
    case "add-account":formAccount(null,d.owner);break;
    case "edit-account":formAccount(d.id);break;
    case "add-ag":formAg(null,d.outlet);break;
    case "edit-ag":formAg(d.id);break;
    case "renew":formRenew(d.id);break;
    case "add-lift":formLift();break;case "edit-lift":formLift(d.id);break;
    case "add-petty":formPetty(null,d.type);break;case "edit-petty":formPetty(d.id);break;
    case "add-clean":formClean();break;case "edit-clean":formClean(d.id);break;
    case "add-task":formTask();break;case "edit-task":formTask(d.id);break;
    case "add-staff":formStaff();break;case "edit-staff":formStaff(d.id);break;
    case "add-doc":formDoc();break;case "view-doc":viewDoc(d.id);break;
    case "add-pay":formPay(null,d.ag,d.ym);break;
    case "view-pay":viewPay(d.id);break;
    case "remind":copyText(reminderText(D.agreements.find(x=>x.id===d.ag),d.ym));break;
    case "set-track":{const v=$("#track-from").value;if(v){D.meta.trackFrom=v;await persist();toast("Tracking starts "+fmtYM(v));render()}break}
    case "backup-file":backupFile();break;
    case "backup-copy":try{await navigator.clipboard.writeText(backupText());toast("Backup copied. Paste it into a note or email to yourself.")}catch(err){openModal("Backup text",`<p class="small muted" style="margin:0">Select all of this and copy it.</p><textarea style="min-height:240px;width:100%" readonly>${esc(backupText())}</textarea>`)}break;
    case "restore":restoreForm();break;
    case "reset":confirmBox("Clear <b>all</b> data on this device and start again with the 30 units and 10 outlets? Download a backup first if you need one.","Reset",async()=>{D=seed();await persist(false);route={tab:"home"};toast("Data reset")});break;
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modalState)closeModal()});

load().then(render);
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js");</script>
</body></html>
